name: vector_map_tiles
description: A plugin for `flutter_map` that enables the use of vector tiles.
version: 9.0.0-beta.8
homepage: https://github.com/greensopinion/flutter-vector-map-tiles

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.1
  http: ^1.0.0
  latlong2: ^0.9.1
  path_provider: ^2.0.2
  vector_tile_renderer: ^6.0.0
  vector_tile_dem: ^0.0.2
  async: ^2.8.2
  executor_lib: ^1.1.1
  idb_shim: ^2.6.1+7

dev_dependencies:
  flutter_lints: ^4.0.0
  test: ^1.24.6


flutter:
